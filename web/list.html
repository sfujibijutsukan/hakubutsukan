<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ed">
  <title>博物館 — hakubutsukan</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="masthead">
    <a class="brand" href="/" aria-label="博物館 ホーム"><span class="seal" aria-hidden="true">博</span><span>hakubutsukan</span></a>
    <nav><a class="admin" href="/">館内へ</a> <a id="dockge" class="admin" hidden target="_blank" rel="noopener noreferrer">管理室 ↗</a></nav>
  </header>
  <main>
    <section class="collection" aria-labelledby="collection-title">
      <div class="section-heading"><h1 id="collection-title">展示室 <span id="count">—</span></h1><p id="updated" class="updated"></p></div>
      <div id="notice" class="notice" role="status" hidden></div>
      <div class="toolbar"><div id="categories" class="filters" aria-label="カテゴリ"></div><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="展示を探す" aria-label="サービス名や説明で検索" autocomplete="off"><kbd>/</kbd></label></div>
      <div class="view-controls"><span id="result-count" aria-live="polite"></span><button id="favorites" class="favorite-filter" aria-pressed="false">☆ お気に入り</button></div>
      <div id="grid" class="grid" aria-live="polite" aria-busy="true"></div>
      <div id="empty" class="empty" hidden><span aria-hidden="true">◇</span><h2 id="empty-title">展示が見つかりませんでした</h2><p id="empty-copy"></p><button id="reset" class="reset">条件をリセット</button></div>
    </section>
  </main>
  <noscript><p class="notice">サービス一覧を表示するにはJavaScriptを有効にしてください。</p></noscript>
</body>
</html>
